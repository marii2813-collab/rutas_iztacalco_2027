<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor Operativo de Rutas Electorales</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root { --azul:#003366; --azul-2:#0b4a8f; --fondo:#f1f5f9; --borde:#e2e8f0; }
  html,body { height:100%; }
  body { background:var(--fondo); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .bg-electoral-blue { background-color:var(--azul); }
  .text-electoral-blue { color:var(--azul); }
  .border-electoral-blue { border-color:var(--azul); }

  /* Layout tipo explorador: barra superior + panel lateral + mapa a pantalla completa */
  #app { display:flex; height:calc(100vh - 56px); min-height:520px; position:relative; }
  #sidebar { width:340px; flex:none; background:#fff; border-right:1px solid var(--borde);
             overflow-y:auto; transition:margin-left .25s ease; z-index:500; }
  #sidebar.colapsado { margin-left:-340px; }
  #mapa-wrap { flex:1; position:relative; min-width:0; }
  #map { position:absolute; inset:0; }

  /* Secciones plegables del panel */
  details.sec { border-bottom:1px solid var(--borde); }
  details.sec > summary { cursor:pointer; list-style:none; padding:12px 16px; display:flex;
      justify-content:space-between; align-items:center; font-size:11px; font-weight:700;
      letter-spacing:.06em; text-transform:uppercase; color:var(--azul); user-select:none; }
  details.sec > summary::-webkit-details-marker { display:none; }
  details.sec > summary::after { content:"▾"; transition:transform .2s; color:#64748b; }
  details.sec:not([open]) > summary::after { transform:rotate(-90deg); }
  details.sec .cuerpo { padding:0 16px 16px; }
